[colors]
background = #e61d1f21
foreground = #f5f5f7
muted = #a1a1a6
accent = #0a84ff

[bar/main]
# launch.sh 会为每个已连接显示器设置 MONITOR。
monitor = ${env:MONITOR:}
width = 100%
height = 22pt
offset-x = 0
offset-y = 0
radius = 0
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt
border-size = 0
padding-left = 1
padding-right = 1
module-margin = 1

font-0 = JetBrains Mono:size=10;2
font-1 = Noto Sans CJK SC:size=10;2

modules-left = xworkspaces xwindow
modules-center = date
modules-right = wlan battery

cursor-click = pointer
enable-ipc = true

# Anybar 补丁会让 dwm 正式管理 Polybar 窗口并为它预留空间。
override-redirect = false

[module/xworkspaces]
type = internal/xworkspaces
pin-workspaces = true
enable-click = true
enable-scroll = false

label-active = %name%
label-active-background = #334f8cff
label-active-underline = ${colors.accent}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = #66ff453a
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.muted}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%
label-empty = Desktop
label-empty-foreground = ${colors.muted}

[module/date]
type = internal/date
interval = 1
date = %a %m-%d
time = %H:%M
label = %date%  %time%

[module/wlan]
type = internal/network
interface = wlp4s0
interval = 3
format-connected = <label-connected>
label-connected = Wi-Fi %essid%
label-disconnected = Wi-Fi Off
label-disconnected-foreground = ${colors.muted}

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP0
full-at = 98
format-charging = <label-charging>
format-discharging = <label-discharging>
format-full = <label-full>
label-charging = AC %percentage%%
label-discharging = BAT %percentage%%
label-full = BAT Full

[settings]
screenchange-reload = true
pseudo-transparency = true
