[colors]
background = #80101a30
foreground = #f5f5f7
muted = #aeb6c5
accent = #5ac8fa
active = #30ffffff
urgent = #e35d6a

[bar/main]
# launch.sh 会为每个已连接显示器设置 MONITOR。
monitor = ${env:MONITOR:}
width = 100%
height = 36px
offset-x = 0
offset-y = 0
radius = 0
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 1px
border-size = 0
border-top-size = 0
border-bottom-size = 4px
border-color = #00000000
padding-left = 1
padding-right = 1
module-margin = 0

font-0 = JetBrains Mono:size=11;4
font-1 = Noto Sans CJK SC:size=11;4
font-2 = FontAwesome:size=11;4
font-3 = DejaVu Sans:size=11;4

modules-left = system-mark xworkspaces
modules-center = date
modules-right = ${env:POLYBAR_RIGHT_MODULES:input-method brightness pulseaudio wlan battery power}

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

# Anybar 补丁会让 dwm 正式管理 Polybar 窗口并为它预留空间。
override-redirect = false

[module/system-mark]
type = custom/text
format = 
format-foreground = ${colors.foreground}
format-padding = 1

[module/xworkspaces]
type = internal/xworkspaces
# 每个显示器的 polybar 只显示并操作自己 monitor 上的 dwm tags。
pin-workspaces = true
enable-click = true
enable-scroll = false

label-active = %name%
label-active-background = ${colors.active}
label-active-foreground = ${colors.foreground}
label-active-padding = 1

label-occupied = %name%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 0

label-urgent = %name%
label-urgent-background = ${colors.urgent}
label-urgent-padding = 2

label-empty =
label-empty-padding = 0

[module/date]
type = internal/date
interval = 1
date = %a %b %d
time = %H:%M
label = %date%  %time%

[module/tray]
type = internal/tray
format-margin = 1
tray-size = 16px
tray-spacing = 5px

[module/input-method]
type = custom/script
exec = ~/workspace/personal/debian-desktop/polybar/input-method.sh status
interval = 1
label = %output%
label-padding = 1
click-left = ~/workspace/personal/debian-desktop/polybar/input-method.sh toggle

[module/brightness]
type = custom/script
exec = ~/workspace/personal/debian-desktop/polybar/brightness.sh get
interval = 2
label = %output%
label-padding = 1
scroll-up = ~/workspace/personal/debian-desktop/polybar/brightness.sh up
scroll-down = ~/workspace/personal/debian-desktop/polybar/brightness.sh down

[module/pulseaudio]
type = custom/script
exec = ~/workspace/personal/debian-desktop/polybar/audio.sh get
interval = 1
label = %output%
label-padding = 1
click-left = pavucontrol
click-right = ~/workspace/personal/debian-desktop/polybar/audio.sh toggle
scroll-up = ~/workspace/personal/debian-desktop/polybar/audio.sh up
scroll-down = ~/workspace/personal/debian-desktop/polybar/audio.sh down

[module/wlan]
type = internal/network
interface = wlp4s0
interval = 3
format-connected = <label-connected>
label-connected =   %signal%%
label-connected-padding = 1
label-disconnected =   --
label-disconnected-foreground = ${colors.muted}
label-disconnected-padding = 1

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP0
full-at = 98
format-charging = <label-charging>
format-discharging = <label-discharging>
format-full = <label-full>
label-charging =   %percentage%%
label-charging-padding = 1
label-discharging =   %percentage%%
label-discharging-padding = 1
label-full =   %percentage%%
label-full-padding = 1

[module/power]
type = custom/text
format = 
format-foreground = ${colors.foreground}
format-padding = 1
click-left = ~/workspace/personal/debian-desktop/polybar/power-menu.sh

[settings]
screenchange-reload = true
pseudo-transparency = false
