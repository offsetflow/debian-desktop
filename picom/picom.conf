# Picom v13 configuration for dwm

# Rendering
backend = "glx";
vsync = true;
use-damage = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
# Keep the compositor active so opening a window over fullscreen content does
# not have to tear down and rebuild the whole composition pipeline.
unredir-if-possible = false;

# Rounded corners
corner-radius = 10;
detect-rounded-corners = true;

# Soft shadows
shadow = true;
# Prevent a window shadow from bleeding into a neighboring monitor.
crop-shadow-to-monitor = true;
shadow-radius = 18;
shadow-offset-x = 0;
shadow-offset-y = 6;
shadow-opacity = 0.28;

# Fading
fading = true;
fade-delta = 4;
fade-in-step = 0.04;
fade-out-step = 0.04;

# Blur
blur-method = "dual_kawase";
blur-strength = 6;
# Blur is enabled only for the small glass surfaces in the rules below.
blur-background = false;
blur-background-frame = false;
blur-background-fixed = true;

# Official Picom v13 animation presets.
animations = (
  {
    triggers = [ "open", "show" ];
    preset = "appear";
    duration = 0.14;
    scale = 0.98;
  },
  {
    triggers = [ "close", "hide" ];
    preset = "disappear";
    duration = 0.12;
    scale = 0.98;
  }
);

# Window-specific behavior.
rules = (
  {
    match = "class_g = 'Polybar'";
    corner-radius = 0;
    shadow = false;
    blur-background = true;
  },
  {
    match = "class_g = 'dmenu'";
    corner-radius = 10;
    shadow = true;
    blur-background = true;
  },
  {
    match = "window_type = 'normal' && !fullscreen && class_g != 'Google-chrome' && class_g != 'Chatgpt' && class_g != 'Marktext'";
    animations = (
      {
        triggers = [ "geometry" ];
        preset = "geometry-change";
        duration = 0.10;
      }
    );
  },
  {
    match = "focused || group_focused";
    opacity = 1.0;
    blur-background = false;
  },
  {
    match = "!focused && !group_focused && !override_redirect";
    opacity = 0.95;
    blur-background = false;
  },
  {
    match = "fullscreen";
    opacity = 1.0;
    corner-radius = 0;
    shadow = false;
    blur-background = false;
  },
  {
    match = "border_width = 0";
    corner-radius = 0;
  },
  {
    match = "(window_type = 'dock' && class_g != 'Polybar') || window_type = 'desktop'";
    corner-radius = 0;
    shadow = false;
    blur-background = false;
  },
  {
    match = "_GTK_FRAME_EXTENTS@";
    shadow = false;
    blur-background = false;
  },
  {
    # st defaults both WM_CLASS values to "st". Match case-insensitively so
    # the rule also survives an explicit `st -c St` launch.
    match = "class_g ?= 'st'";
    # Keep glyphs and the cursor opaque; st's ARGB background supplies the
    # transparency that reveals Picom's blur underneath it.
    opacity = 1.0;
    blur-background = true;
    blur-opacity = 1.0;
  },
  {
    match = "class_g = 'mpv' || class_g = 'obs' || class_g = 'Gimp' || class_g = 'vncviewer'";
    opacity = 1.0;
  },
  {
    match = "class_g *= 'fcitx' || class_g *= 'wemeetapp' || name *= 'wechat'";
    corner-radius = 0;
    shadow = false;
    blur-background = false;
  },
  {
    match = "window_type = 'tooltip'";
    opacity = 0.55;
    shadow = false;
  }
);
